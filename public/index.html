<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Task Manager</h1>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <form id="login-form" class="auth-form">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" required autocomplete="username" />

        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password" />

        <button type="submit">Login</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label for="register-username">Username</label>
        <input type="text" id="register-username" required autocomplete="username" />

        <label for="register-password">Password (min 6 characters)</label>
        <input type="password" id="register-password" required minlength="6" autocomplete="new-password" />

        <button type="submit">Register</button>
      </form>

      <p id="auth-message" class="message"></p>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
